<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4dc"/>
      <stop offset="50%" stop-color="#d4a863"/>
      <stop offset="100%" stop-color="#8a6528"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d4a863" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#030204" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background Disc -->
  <rect width="64" height="64" rx="14" fill="#030204"/>
  <!-- Glow -->
  <circle cx="32" cy="32" r="28" fill="url(#sunGlow)"/>
  <!-- Orbital Ring -->
  <ellipse cx="32" cy="32" rx="23" ry="9" fill="none" stroke="#d4a863" stroke-width="1.6" stroke-dasharray="3 2" transform="rotate(-25 32 32)" opacity="0.85"/>
  <!-- Orbiting Telemetry Nodes -->
  <circle cx="48" cy="24" r="2.5" fill="#38bdf8"/>
  <circle cx="16" cy="40" r="2" fill="#34d399"/>
  <!-- Center Star Core -->
  <circle cx="32" cy="32" r="7" fill="url(#goldGrad)"/>
  <circle cx="32" cy="32" r="3.5" fill="#fcfbf9"/>
</svg>
